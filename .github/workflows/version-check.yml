name: version-check

# Weekly: Claude checks the software facts on these pages against current primary sources and
# opens a pull request with any corrections, each with its sources. The checker and the
# reusable workflow live in ATR-Lab/.github (tools/docs-version-updater/README.md).

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays, 12:00 UTC
  workflow_dispatch:
    inputs:
      paths:
        description: Globs of the pages to check (blank checks the usual pages)
        type: string
        default: ""
      max-files:
        description: Check at most this many pages (0 checks them all)
        type: number
        default: 0

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    uses: ATR-Lab/.github/.github/workflows/docs-version-updater.yml@main
    with:
      paths: ${{ inputs.paths || 'tech-stack/*.md hardware/*.md' }}
      max-files: ${{ fromJSON(format('{0}', inputs.max-files || 0)) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_ATR_LAB_DOC_UPDATER }}
